<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body class="gradient-bg">
    <main class="auth-shell">
        <section class="card auth-card">
            <p class="eyebrow">Birthday Site</p>
            <h1>Unlock the surprise</h1>
            <p class="subtext">Sign in to enter the birthday dashboard.</p>

            {% if error %}
            <div class="alert">{{ error }}</div>
            {% endif %}

            <form method="post" class="stack">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" required>

                <button type="submit">Login</button>
            </form>

            <div class="hint-box">
                <strong>Default login</strong>
                <p>Username: {{ default_username }}</p>
                <p>Password: {{ default_password }}</p>
            </div>
        </section>
    </main>
</body>
</html>
