<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>
<body class="gradient-bg">
    <main class="page-shell">
        <section class="card center-panel">
            <p class="eyebrow">Countdown</p>
            <h1>The celebration starts soon</h1>
            <div id="countdown" class="timer" data-target="{{ target_birthday }}">
                <div><span id="days">00</span><small>Days</small></div>
                <div><span id="hours">00</span><small>Hours</small></div>
                <div><span id="minutes">00</span><small>Minutes</small></div>
                <div><span id="seconds">00</span><small>Seconds</small></div>
            </div>
            <p id="countdown-message" class="subtext">Set your target date in <code>app.py</code> if needed.</p>
            <a class="ghost-link" href="{{ url_for('dashboard') }}">Back to dashboard</a>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/countdown.js') }}"></script>
</body>
</html>
