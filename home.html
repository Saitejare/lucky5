<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Wishes 🎉</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:'Segoe UI',sans-serif;

background:url("images/image.png")
center/contain no-repeat fixed;

color:white;
text-align:center;
min-height:100vh;

}

.overlay{
position:fixed;
inset:0;
background:
linear-gradient(180deg,rgba(9,8,20,0.82),rgba(76,15,54,0.7)),
radial-gradient(circle at 80% 12%,rgba(255,193,7,0.2),transparent 30%);
z-index:-1;
}

/* Hero */

.hero{

padding:64px 20px 44px;
max-width:980px;
margin:0 auto;

}

h1{

font-size:72px;
margin:0;
line-height:1.05;

background:linear-gradient(
45deg,#fff0f6,#ff4081,#ffc107);

-webkit-background-clip:text;
background-clip:text;

color:transparent;
filter:drop-shadow(0 12px 34px rgba(0,0,0,0.45));

}

h2{
font-size:36px;
margin:12px 0 0;
color:#ffe2ec;
font-weight:600;
}

.video-box{

width:90%;

max-width:560px;

margin:34px auto 28px;

border-radius:18px;

overflow:hidden;

background:#000;

border:1px solid rgba(255,255,255,0.22);
box-shadow:0 24px 70px rgba(0,0,0,0.55);

}

video{

width:100%;

max-height:70vh;

object-fit:contain;

display:block;

}

/* Button */

.next{

margin-top:16px;

padding:14px 30px;

background:linear-gradient(135deg,#ff4081,#ff9f1c);

color:white;

text-decoration:none;

border-radius:999px;

font-size:18px;
font-weight:700;

display:inline-block;
box-shadow:0 12px 30px rgba(255,64,129,0.35);
transition:transform 0.2s ease,box-shadow 0.2s ease;

}

.next:hover{
transform:translateY(-2px);
box-shadow:0 16px 34px rgba(255,64,129,0.48);
}

@media (max-width:600px){
.hero{
padding-top:46px;
}

h1{
font-size:44px;
}

h2{
font-size:26px;
}
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="hero">

<h1>Happy Birthday 🎉</h1>

<h2>Sanjana</h2>

<div class="video-box">

<video id="birthdayVideo" autoplay playsinline preload="auto" controls>

<source
src="videos/Untitled-.mp4"
type="video/mp4">

</video>

</div>

<a href="message.html"
class="next">

Next → Message 💌

</a>

</div>

<script>
const birthdayVideo = document.getElementById('birthdayVideo');

birthdayVideo.play().catch(() => {
  birthdayVideo.controls = true;
});
</script>

</body>
</html>
