<!DOCTYPE html>

<title>Memories 📸</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:'Segoe UI',sans-serif;

background:
linear-gradient(135deg,#130f24,#35162e 54%,#111);

color:white;

text-align:center;
min-height:100vh;

}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at 80% 10%,rgba(255,193,7,0.16),transparent 30%);
z-index:-1;
}

h1{
font-size:58px;
margin:52px 18px 10px;
background:linear-gradient(45deg,#fff,#ff85ad,#ffc107);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:drop-shadow(0 12px 30px rgba(0,0,0,0.38));
}

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
grid-auto-flow:dense;
grid-auto-rows:120px;
gap:18px;

width:min(1180px,94vw);
margin:0 auto;
padding:34px 0 38px;

}

.photo{
position:relative;
grid-row:span 3;
min-height:280px;
overflow:hidden;
border-radius:16px;
border:1px solid rgba(255,255,255,0.18);
box-shadow:0 18px 44px rgba(0,0,0,0.45);
background:#160d1d;
transition:transform 0.22s ease,box-shadow 0.22s ease;
}

.photo::before{
content:"";
position:absolute;
inset:0;
background-image:var(--img);
background-size:cover;
background-position:center;
filter:blur(18px);
transform:scale(1.12);
opacity:0.55;
}

.photo::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(0,0,0,0.04),rgba(0,0,0,0.2));
}

.photo img{
position:relative;
z-index:1;

width:100%;
max-width:100%;
height:100%;

object-fit:contain;
display:block;
}

.photo.tall{
grid-row:span 4;
}

.photo.wide{
grid-column:span 2;
grid-row:span 2;
}

.photo:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 24px 54px rgba(0,0,0,0.6);
}

.next{

padding:14px 30px;

background:linear-gradient(135deg,#ff4081,#ff9f1c);

color:white;

text-decoration:none;

border-radius:999px;
display:inline-block;
margin-bottom:44px;
font-weight:700;
box-shadow:0 12px 30px rgba(255,64,129,0.35);
transition:transform 0.2s ease,box-shadow 0.2s ease;

}

.next:hover{
transform:translateY(-2px);
box-shadow:0 16px 34px rgba(255,64,129,0.48);
}

@media (max-width:520px){
h1{
font-size:38px;
}

.gallery{
grid-template-columns:1fr;
grid-auto-rows:95px;
}

.photo,
.photo.wide{
grid-column:span 1;
}
}

</style>

</head>
